<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form target="_blank">
        <h1>Registration Form</h1>
        <label> First Name:</label>
        <input type="text" name="name" id="" placeholder="Enter First Name"><br>
        <label>Last Name:</label>
        <input type="text" name="surname" id="" placeholder="Enter Last Name"><br>
        <label>Email:</label>
        <input type="email" name="email" id="" placeholder="Enter Email Address"><br>
        <label>Password:</label>
        <input type="password" name="password" id=""><br>
        <label>Gender:</label><br>
        Male<input type="radio" name="gender" id="" value="Male"><br>
        Female<input type="radio" name="gender" id="" value="Female"><br>
        Others<input type="radio" name="gender" id="" value="Other"><br>
        <label>Age:</label>
        <input type="number" name="age" id=""><br>
        <label>Preferences</label><br>
        Acrylic Painting<input type="checkbox" name="p" id="" value="Acrylic Painting"><br>
        Oil Painting<input type="checkbox" name="p" id="" value="Oil Painting"><br>
        Water Color Painting<input type="checkbox" name="p" id="" value="Water Color Painting"><br>
        <label>Select Occupation:</label>
        <select>
            <option>Student</option>
        </select><br>
        <label>Bio:</label>
        <textarea name="" id="" placeholder="Share few lines about yourself" cols="19" rows="4"></textarea>
    </form>
</body>
</html>
