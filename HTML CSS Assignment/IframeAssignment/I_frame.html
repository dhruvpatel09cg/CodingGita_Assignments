<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <h1 align="center">Iframe Assignment</h1>
    <h3>Q: 01</h3>
</body>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Example Website</title>
    </head>
    <body>
        <iframe
            src="https://www.example.com"
            width="100%"
            height="400"
            title="Example website"
            style="border: none;">
        </iframe>
        <h3>Q: 02</h3>
    </body>
    </html>

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Named Iframe</title>
    </head>
    <body>
        <a href="https://www.example.com" target="exampleframe">Open Example Site</a><br>
        <iframe
            name="exampleframe"
            width="100%"
            height="300"
            title="Example Site"
            style="border: none;">
        </iframe>
        <h3>Q: 03</h3>

        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/XGa4onZP66Q?si=uYECzKF8hEzeQHej"
            allow="fullscreen, gyroscope"
            allowfullscreen
            title="YouTube Video">
        </iframe>
        <h3>Q: 04</h3>
    </body>
    </html>

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            .responsive-iframe {
                width: 100%;
                height: 400px;
                border: none;
                margin: 10px;
            }
        </style>
    </head>
    <body>
        <iframe
            class="responsive-iframe"
            src="https://www.example.com"
            title="Responsive iframe">
        </iframe>
    </body>
    </html>
</html>
