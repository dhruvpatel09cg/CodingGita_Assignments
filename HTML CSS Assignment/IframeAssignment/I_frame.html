    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Example Website</title>
    </head>
    <body>
        <iframe
            src="https://www.example.com"
            width="100%"
            height="400"
            title="Example website"
            style="border: none;">
        </iframe>
        <h3>Q: 02</h3>
    </body>
    </html>

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Named Iframe</title>
    </head>
    <body>
        <a href="https://www.example.com" target="exampleframe">Open Example Site</a><br>
        <iframe
            name="exampleframe"
            width="100%"
            height="300"
            title="Example Site"
            style="border: none;">
        </iframe>
        <h3>Q: 03</h3>

        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/XGa4onZP66Q?si=uYECzKF8hEzeQHej"
            allow="fullscreen, gyroscope"
            allowfullscreen
            title="YouTube Video">
        </iframe>
        <h3>Q: 04</h3>
    </body>
    </html>

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            .responsive-iframe {
                width: 100%;
                height: 400px;
                border: none;
                margin: 10px;
            }
        </style>
    </head>
    <body>
        <iframe
            class="responsive-iframe"
            src="https://www.example.com"
            title="Responsive iframe">
        </iframe>
        <h3>Q: 05</h3>

        <iframe
            src="https://www.youtube.com/embed/X1aFkAkFASk?si=w8OJD6GLy9CGj_Aj"
            width="800"
            height="450"
            allow="fullscreen"
            title="Only Fullscreen">
        </iframe>
        <h3>Q: 06</h3>

        <iframe
            src="https://www.youtube.com/embed/BvKxCCVNXrY?si=Uny5LIq5L3OPAPnu"
            width="100%"
            height="500"
            allow="gyroscope"
            title="Only Gyroscope">
        </iframe>
        <h3>Q: 07</h3>

        <iframe
            src="https://device.example.com"
            width="600"
            height="450"
            allow="usb"
            title="USB only">
        </iframe>
        <h3>Q: 08</h3>

        <iframe
            src="https://www.youtube.com/embed/WJWaiXlcWrs?si=NuAKAzx0kmhhuhOw"
            width="600"
            height="315"
            allow="fullscreen; usb; gyroscope"
            title="Interactive Device">
        </iframe>
        <h3>Q: 09</h3>
    </body>
    </html>

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Permission Comparision</title>
        <style>
            .iframe-container {
                display: flex;
                justify-content: space-between;
                gap: 4%;
            }
            iframe {
                width: 48%;
                height: 350px;
                border: none;
            }
        </style>
    </head>
    <body>
        <div class="iframe-container">
            <iframe
                src="https://www.youtube.com/embed/s5Vs4XBJrZY?si=wgfgDSF2uioy4WZ-"
                allow="fullscreen"
                title="Fullscreen">
            </iframe>
            <iframe
                src="https://www.youtube.com/embed/CkuyDsnXv-0?si=fAxzN9gXMuOTMlNa"
                allow="gyroscope"
                title="Gyroscope">
            </iframe>
        </div>
    </body>
    </html>
</html>
